[tool.poetry]
name = "ola_backend_autotests"
version = "0.1.0"
description = ""
authors = [
    "Roman Kofeynikov <Roman.Kofeynikov@bki-okb.ru>",
    "Vadim Tereshkin <Vadim.Tereshkin@bki-okb.ru>"
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
allure-pytest = "2.13.2"
environs = "10.3.0"
marshmallow-dataclass = { extras = ["enum", "union"], version = "8.6.0" }
psycopg2 = "2.9.9"
psycopg2-binary = "2.9.9"
pytest = "8.0.1"
python-box = { extras = ["ruamel-yaml"], version = "7.1.1" }
requests = "2.31.0"
faker = "^23.2.1"
pytest-bug = "^1.3.1"

[tool.poetry.group.dev.dependencies]
add-trailing-comma = "^2.3.0"
bandit = { extras = ["toml"], version = "^1.7.4" }
black = "^24.2.0"
flake8 = "7.0.0"
flake8-annotations = "^3.0.1"
flake8-broken-line = "^1.0.0"
flake8-bugbear = "^23.9.16"
flake8-cognitive-complexity = "^0.1.0"
flake8-commas = "^2.1.0"
flake8-multiline-containers = "^0.0.19"
flake8-pyproject = "^1.2.3"
flake8-quotes = "^3.3.2"
flake8-use-pathlib = "^0.3.0"
isort = "^5.10.1"
mypy = "^1.5.1"
pylint = "^2.17.5"
types-requests = "^2.31.0.10"
autoflake = "^2.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
case_sensitive = true
combine_star = true
include_trailing_comma = true
indent = 4
line_length = 120
multi_line_output = 3
use_parentheses = true

[tool.bandit]
skips = ["B101", "B311", "B404", "B405", "B501", "B603", "B605", "B314", "B113", "B310", "B608"]
exclude_dirs = [".venv"]

[tool.mypy]
ignore_missing_imports = true
ignore_errors = false
python_version = 3.11


[tool.pylint.messages_control]
max-line-length = 120
disable = ["logging-fstring-interpolation", "duplicate-code", "fixme", "too-many-locals", "too-few-public-methods"]

[tool.flake8]
exclude = [".venv"]
max-line-length = 120
count = true
ignore = ["ANN101", "ANN102", "ANN002", "ANN003", "ANN401", "CCE001", "C812", "ANN204"]
per-file-ignores = "test_*.py: ANN201, ANN001"
dispatch-decorators = ["fixture", "parametrize"]
inline-quotes = "double"

[tool.pytest.ini_options]
addopts = "--showlocals"
norecursedirs = [".venv", "src"]

log_level = "INFO"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s,%(msecs)03d - %(levelname)s - %(name)s - %(message)s"

log_cli = false
log_file_level = "DEBUG"
log_file = "pytest.log"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_file_format = "%(asctime)s,%(msecs)03d - %(levelname)s - %(name)s - %(message)s"
